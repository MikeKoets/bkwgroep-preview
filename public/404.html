<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>BKW Groep | Doorsturen</title>
  </head>
  <body>
    <p>De preview wordt geladen…</p>
    <script>
      const base = '/bkwgroep-preview/'
      const path = window.location.pathname.replace(/^\/bkwgroep-preview\/?/, '')
      const destination = base + '?path=' + encodeURIComponent(path + window.location.search + window.location.hash)
      window.location.replace(destination)
    </script>
  </body>
</html>
