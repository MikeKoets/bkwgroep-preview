<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Capture the first mobile-menu tap even before the small bootstrap loads.
      document.addEventListener('click', function (event) {
        var button = event.target instanceof Element ? event.target.closest('.menu-button') : null;
        if (!button || button.dataset.interactive === 'true') return;
        event.preventDefault();
        event.stopImmediatePropagation();
        window.__bkwPendingMenu = true;
        if (window.__bkwHydrate) window.__bkwHydrate();
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#202623" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-bkw.svg" />
    <link
      rel="preload"
      href="/assets/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Conceptuele redesign-preview voor BKW Groep. Deze demo verwerkt geen persoonsgegevens."
    />
    <title>BKW Groep | Websitepreview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" fetchpriority="low" src="/src/bootstrap.ts"></script>
  </body>
</html>
