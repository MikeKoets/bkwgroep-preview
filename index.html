<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#252525" />
    <meta
      name="description"
      content="Conceptuele redesign-preview voor BKW Groep. Deze demo verwerkt geen persoonsgegevens."
    />
    <title>BKW Groep | Websitepreview</title>
    <script>
      ;(() => {
        const params = new URLSearchParams(window.location.search)
        const redirectPath = params.get('path')
        if (!redirectPath) return
        const base = '/bkwgroep-preview/'
        window.history.replaceState(null, '', base + redirectPath.replace(/^\//, ''))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
